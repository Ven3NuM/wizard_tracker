# A tag v1.2.3 (same as webapp/package.json) builds the signed Android app and publishes a GitHub Release:
# the .apk to install from GitHub, the .aab for the Play Store.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./webapp/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but webapp/package.json says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test
      - run: npm run app:build

      - name: Build signed APK and AAB
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease bundleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp app/android/app/build/outputs/apk/release/app-release.apk "out/wizard-tracker-$VERSION.apk"
          cp app/android/app/build/outputs/bundle/release/app-release.aab "out/wizard-tracker-$VERSION.aab"
          gh release create "$GITHUB_REF_NAME" out/* --title "Wizard Tracker $VERSION" --generate-notes
